general {
    lock_cmd = pidof swaylock || swaylock -f -c 000000
    before_sleep_cmd = loginctl lock-session
}

# 1. Bloqueia a tela aos 200s
listener {
    timeout = 200
    on-timeout = loginctl lock-session
}

# 2. Desliga a tela aos 300s
listener {
    timeout = 300
    on-timeout = swaymsg "output * dpms off"
    on-resume = swaymsg "output * dpms on"
}

# 3. Suspende o PC aos 1000s
listener {
    timeout = 1000
    on-timeout = systemctl suspend
}
